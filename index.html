<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#25346f"
  >

  <meta
    name="application-name"
    content="Ausbildungsplanung"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Ausbildungsplanung"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    property="og:title"
    content="Ausbildungsplanung – Feuerwehr St. Pölten-Stadt"
  >

  <meta
    property="og:description"
    content="Interne Ausbildungsplanung der Feuerwehr St. Pölten-Stadt"
  >

  <link
    rel="icon"
    type="image/png"
    href="./ausbildungs-icon-20260922.png?v=6"
  >

  <link
    rel="apple-touch-icon"
    href="./ausbildungs-icon-20260922.png?v=6"
  >

  <link
    rel="manifest"
    href="./manifest.json?v=4"
  >

  <title>
    Ausbildungsplaner – Feuerwehr St. Pölten-Stadt
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f3f5f9;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    #app {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #f3f5f9;
    }


    #plannerFrame {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #f3f5f9;
    }


    #loading {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 14px;

      background:
        linear-gradient(
          135deg,
          #25346f,
          #34499a
        );

      color: #ffffff;

      font-size: 14px;
      font-weight: 800;
    }


    .spinner {
      width: 42px;
      height: 42px;

      border:
        4px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      border-top-color:
        #ffffff;

      border-radius:
        50%;

      animation:
        spin
        0.8s
        linear
        infinite;
    }


    @keyframes spin {

      to {
        transform:
          rotate(
            360deg
          );
      }

    }


    #installOverlay {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: flex-end;
      justify-content: center;

      padding: 16px;

      background:
        rgba(
          15,
          22,
          42,
          0.72
        );

      backdrop-filter:
        blur(
          7px
        );

      -webkit-backdrop-filter:
        blur(
          7px
        );
    }


    #installOverlay.show {
      display: flex;
    }


    .install-card {
      width:
        min(
          450px,
          100%
        );

      margin-bottom:
        env(
          safe-area-inset-bottom
        );

      padding:
        26px 21px;

      border-radius:
        25px;

      background:
        #ffffff;

      text-align:
        center;

      box-shadow:
        0 25px 80px
        rgba(
          0,
          0,
          0,
          0.32
        );
    }


    .install-icon {
      width: 82px;
      height: 82px;

      margin:
        0 auto 14px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid
        #e4e8f0;

      border-radius:
        22px;

      background:
        #ffffff;
    }


    .install-icon img {
      width: 72px;
      height: 72px;

      object-fit:
        contain;

      border-radius:
        18px;
    }


    .install-brand {
      color:
        #34499a;

      font-size:
        10px;

      font-weight:
        900;

      letter-spacing:
        0.08em;
    }


    .install-card h2 {
      margin:
        8px 0;

      color:
        #25346f;

      font-size:
        23px;
    }


    .install-card p {
      color:
        #718096;

      font-size:
        13px;

      line-height:
        1.5;
    }


    .install-button {
      width:
        100%;

      min-height:
        52px;

      margin-top:
        18px;

      border:
        0;

      border-radius:
        14px;

      background:
        linear-gradient(
          135deg,
          #25346f,
          #34499a
        );

      color:
        #ffffff;

      font-weight:
        900;

      cursor:
        pointer;
    }


    .install-later {
      width:
        100%;

      min-height:
        46px;

      margin-top:
        8px;

      border:
        0;

      border-radius:
        14px;

      background:
        #edf0f5;

      color:
        #354052;

      font-weight:
        800;

      cursor:
        pointer;
    }


    #iosHelp {
      display:
        none;

      margin-top:
        15px;

      padding:
        15px;

      border-radius:
        14px;

      background:
        #eef1fb;

      color:
        #25346f;

      font-size:
        13px;

      line-height:
        1.55;
    }

  </style>

</head>


<body>


  <div id="app">

    <iframe
      id="plannerFrame"
      allowfullscreen
    ></iframe>

  </div>


  <div id="loading">

    <div class="spinner"></div>

    <div>
      Ausbildungsplaner wird geladen …
    </div>

  </div>


  <div id="installOverlay">

    <div class="install-card">

      <div class="install-icon">

        <img
          src="./ausbildungs-icon-20260922.png?v=6"
          alt="Ausbildungsplaner"
        >

      </div>


      <div class="install-brand">
        FEUERWEHR ST. PÖLTEN-STADT
      </div>


      <h2>
        Ausbildungsplaner installieren
      </h2>


      <p id="installText">

        Der Ausbildungsplaner kann als App auf diesem Gerät installiert werden.

      </p>


      <div id="iosHelp">

        <strong>
          iPhone / iPad
        </strong>

        <br><br>

        Tippe in Safari auf

        <br><br>

        <strong>
          Teilen ⬆️
        </strong>

        <br><br>

        und anschließend auf

        <br>

        <strong>
          „Zum Home-Bildschirm“
        </strong>

      </div>


      <button
        id="installButton"
        class="install-button"
        type="button"
        style="display:none"
      >

        📲 App installieren

      </button>


      <button
        id="installLater"
        class="install-later"
        type="button"
      >

        Jetzt nicht

      </button>

    </div>

  </div>


  <script>

    const PLANNER_URL =
      'https://script.google.com/macros/s/AKfycbyAbgkQBR514pZ1kXxEnNyCpWKHM2opbnV4Y0-MPJjr4eYW6mAWY9H0SSIGUpj0FXukXg/exec?view=planner';


    function openPlanner() {

      const frame =
        document.getElementById(
          'plannerFrame'
        );


      const loading =
        document.getElementById(
          'loading'
        );


      frame.onload =
        function() {

          loading.style.display =
            'none';

        };


      frame.src =
        PLANNER_URL +
        '&v=' +
        Date.now();

    }


    document.addEventListener(
      'DOMContentLoaded',
      openPlanner
    );

  </script>


  <script>

    let deferredInstallPrompt =
      null;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const installRequested =
      params.get(
        'install'
      ) ===
      '1';


    const installOverlay =
      document.getElementById(
        'installOverlay'
      );


    const installButton =
      document.getElementById(
        'installButton'
      );


    const installLater =
      document.getElementById(
        'installLater'
      );


    const installText =
      document.getElementById(
        'installText'
      );


    const iosHelp =
      document.getElementById(
        'iosHelp'
      );


    function isInstalled() {

      return (

        window
          .matchMedia(
            '(display-mode: standalone)'
          )
          .matches ||

        window.navigator.standalone ===
          true

      );

    }


    function cleanInstallUrl() {

      const url =
        new URL(
          window.location.href
        );


      url
        .searchParams
        .delete(
          'install'
        );


      url
        .searchParams
        .delete(
          'source'
        );


      history.replaceState(
        {},
        '',
        url.pathname +
        url.search +
        url.hash
      );

    }


    function showIosInstall() {

      installButton.style.display =
        'none';


      iosHelp.style.display =
        'block';


      installText.textContent =
        'Installiere den Ausbildungsplaner auf deinem Home-Bildschirm.';


      installOverlay
        .classList
        .add(
          'show'
        );

    }


    function showAndroidInstall() {

      iosHelp.style.display =
        'none';


      installButton.style.display =
        'block';


      installOverlay
        .classList
        .add(
          'show'
        );

    }


    window.addEventListener(
      'beforeinstallprompt',

      function(event) {

        event.preventDefault();


        deferredInstallPrompt =
          event;


        if (
          installRequested &&
          !isInstalled()
        ) {

          showAndroidInstall();

        }

      }
    );


    installButton.addEventListener(
      'click',

      async function() {

        if (
          !deferredInstallPrompt
        ) {

          return;

        }


        deferredInstallPrompt.prompt();


        await deferredInstallPrompt
          .userChoice;


        deferredInstallPrompt =
          null;


        installOverlay
          .classList
          .remove(
            'show'
          );


        cleanInstallUrl();

      }
    );


    installLater.addEventListener(
      'click',

      function() {

        installOverlay
          .classList
          .remove(
            'show'
          );


        cleanInstallUrl();

      }
    );


    window.addEventListener(
      'load',

      function() {

        if (
          !installRequested ||
          isInstalled()
        ) {

          return;

        }


        const ua =
          navigator.userAgent;


        const ios =
          /iPhone|iPad|iPod/i
            .test(
              ua
            ) ||

          (
            navigator.platform ===
              'MacIntel' &&

            navigator.maxTouchPoints >
              1
          );


        if (
          ios
        ) {

          setTimeout(
            showIosInstall,
            500
          );

        }

      }
    );


    if (
      'serviceWorker' in
      navigator
    ) {

      window.addEventListener(
        'load',

        function() {

          navigator
            .serviceWorker
            .register(
              './sw.js'
            )
            .catch(
              function(error) {

                console.error(
                  'Service Worker Fehler:',
                  error
                );

              }
            );

        }
      );

    }

  </script>


</body>

</html>
